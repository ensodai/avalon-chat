# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true

# Enables caching of task outputs.
org.gradle.caching=true

# Enables configuration caching.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Speed up build by watching file system changes
org.gradle.vfs.watch=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

app.versionName=5.1.1 beta
app.versionCode=87
app.displayName=Avalon avatars
app.compileSdk=37
app.minSdk=26
app.targetSdk=37

kotlin.incremental.js=false
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ==========================================
# 🌐 Remote Endpoints & Community Links
# ==========================================
# Базовый URL бэкенда для клиентских запросов по умолчанию (для эмулятора Android: 10.0.2.2, для десктопа: localhost)
# Значение можно переопределить через APP_SERVER_BASE_URL в файле .env или переменные окружения
app.server.baseUrl=http://10.0.2.2:8080
# WebSocket URL для протокола синхронизации и звонков (если не указаны, выводятся автоматически из baseUrl)
app.server.syncWsUrl=ws://10.0.2.2:8080/
app.server.liveCallWsUrl=ws://10.0.2.2:8080/
# Имя Telegram канала новостей проекта (t.me/avalon_avatars)
app.telegram.channelName=avalon_avatars
# Username Telegram бота для обратной связи и предложений (t.me/ensobaza_bot)
app.telegram.botUsername=ensobaza_bot
# Ссылки на правила использования и политику конфиденциальности
app.legal.termsUrl=https://avalonavatars.site/terms
app.legal.privacyUrl=https://avalonavatars.site/privacy
